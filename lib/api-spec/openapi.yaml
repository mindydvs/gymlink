openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GymLink API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: Gym member profiles
  - name: connections
    description: Connection requests between users
  - name: notifications
    description: Incoming connection notifications
  - name: stats
    description: Gym activity stats
  - name: gyms
    description: Gym locations
  - name: storage
    description: File upload and serving
  - name: videos
    description: Workout form videos

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List gym members
      parameters:
        - name: gym
          in: query
          schema:
            type: string
        - name: interest
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user's profile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteMe
      tags: [users]
      summary: Permanently delete the current user's account
      responses:
        "204":
          description: Account deleted

  /users/me/checkin:
    post:
      operationId: checkIn
      tags: [users]
      summary: Check in or out of a gym
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInBody"
      responses:
        "200":
          description: Updated user profile with check-in status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user profile by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

  /connections:
    post:
      operationId: createConnection
      tags: [connections]
      summary: Send a connection request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConnectionBody"
      responses:
        "201":
          description: Connection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
    get:
      operationId: listConnections
      tags: [connections]
      summary: List all connections for current user
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ConnectionType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ConnectionStatus"
      responses:
        "200":
          description: List of connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"

  /connections/{id}/respond:
    post:
      operationId: respondToConnection
      tags: [connections]
      summary: Accept or decline a connection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondConnectionBody"
      responses:
        "200":
          description: Connection updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /stats:
    get:
      operationId: getGymStats
      tags: [stats]
      summary: Get gym activity stats for the current user's gym
      responses:
        "200":
          description: Gym stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymStats"

  /gyms:
    get:
      operationId: listGyms
      tags: [gyms]
      summary: List available gyms
      responses:
        "200":
          description: List of gyms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gym"
    post:
      operationId: addGym
      tags: [gyms]
      summary: Add a real gym (verified against OpenStreetMap)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGymBody"
      responses:
        "200":
          description: Gym already existed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gym"
        "201":
          description: Gym created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gym"
        "422":
          description: Place could not be verified as a real gym

  /gyms/search:
    get:
      operationId: searchGyms
      tags: [gyms]
      summary: Search real-world gyms by name
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching real gyms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GymCandidate"

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content

  /videos:
    get:
      operationId: listWorkoutVideos
      tags: [videos]
      summary: List workout form videos for a user
      parameters:
        - name: userId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkoutVideo"
    post:
      operationId: createWorkoutVideo
      tags: [videos]
      summary: Upload a workout form video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkoutVideoBody"
      responses:
        "201":
          description: Video created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutVideo"

  /videos/{id}:
    patch:
      operationId: updateWorkoutVideo
      tags: [videos]
      summary: Update a workout video title
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkoutVideoBody"
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkoutVideo"
    delete:
      operationId: deleteWorkoutVideo
      tags: [videos]
      summary: Delete a workout video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /videos/{id}/like:
    post:
      operationId: toggleVideoLike
      tags: [videos]
      summary: Toggle like on a workout video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated like status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoLikeStatus"

  /videos/{id}/likes:
    get:
      operationId: getVideoLikes
      tags: [videos]
      summary: Get like count and whether the current user liked a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Like info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoLikeStatus"

  /users/{id}/block:
    post:
      operationId: blockUser
      tags: [users]
      summary: Block a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
    delete:
      operationId: unblockUser
      tags: [users]
      summary: Unblock a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Unblocked

  /users/{id}/report:
    post:
      operationId: reportUser
      tags: [users]
      summary: Report a user for inappropriate content or behavior
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportBody"
      responses:
        "201":
          description: Reported
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /videos/{id}/report:
    post:
      operationId: reportVideo
      tags: [videos]
      summary: Report a video for inappropriate content
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportBody"
      responses:
        "201":
          description: Reported
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /blocks:
    get:
      operationId: listBlocks
      tags: [users]
      summary: List users the current user has blocked
      responses:
        "200":
          description: List of blocked users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockedUser"

components:
  schemas:
    ReportBody:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 120
        details:
          type: string
          maxLength: 2000

    BlockedUser:
      type: object
      required: [blockedId, name, avatar, createdAt]
      properties:
        blockedId:
          type: string
        name:
          type: string
        avatar:
          type: string
        avatarUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ConnectionType:
      type: string
      enum: [crush, buddy, advisor, spotter, mutual_crush]

    ConnectionStatus:
      type: string
      enum: [pending, accepted, declined]

    Gym:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        city:
          type: string
        memberCount:
          type: integer
      required:
        - id
        - name
        - address
        - city
        - memberCount

    GymCandidate:
      type: object
      properties:
        osmType:
          type: string
        osmId:
          type: integer
        name:
          type: string
        address:
          type: string
        city:
          type: string
        lat:
          type: string
        lon:
          type: string
      required:
        - osmType
        - osmId
        - name
        - address
        - city
        - lat
        - lon

    AddGymBody:
      type: object
      properties:
        osmType:
          type: string
        osmId:
          type: integer
      required:
        - osmType
        - osmId

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        age:
          type: integer
        avatar:
          type: string
          description: Emoji or image URL
        bio:
          type: string
        gym:
          type: string
        gymId:
          type: string
          nullable: true
        schedule:
          type: string
        interests:
          type: array
          items:
            type: string
        verified:
          type: boolean
        distance:
          type: string
        isMe:
          type: boolean
        activeNow:
          type: boolean
        checkedIn:
          type: boolean
        avatarUrl:
          type: string
          nullable: true
        hidden:
          type: boolean
      required:
        - id
        - name
        - age
        - avatar
        - bio
        - gym
        - schedule
        - interests
        - verified

    UpdateProfileBody:
      type: object
      properties:
        name:
          type: string
        age:
          type: integer
        bio:
          type: string
        gym:
          type: string
        gymId:
          type: string
        schedule:
          type: string
        interests:
          type: array
          items:
            type: string
        avatarUrl:
          type: string
          nullable: true
        hidden:
          type: boolean

    CheckInBody:
      type: object
      properties:
        gymId:
          type: string
        gymName:
          type: string
      required:
        - gymId
        - gymName

    Connection:
      type: object
      properties:
        id:
          type: string
        fromUserId:
          type: string
        toUserId:
          type: string
        type:
          $ref: "#/components/schemas/ConnectionType"
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        anonymous:
          type: boolean
        createdAt:
          type: string
          format: date-time
        fromUser:
          $ref: "#/components/schemas/User"
        toUser:
          $ref: "#/components/schemas/User"
      required:
        - id
        - fromUserId
        - toUserId
        - type
        - status
        - anonymous
        - createdAt

    CreateConnectionBody:
      type: object
      properties:
        toUserId:
          type: string
        type:
          $ref: "#/components/schemas/ConnectionType"
        anonymous:
          type: boolean
        mutualNotify:
          type: boolean
      required:
        - toUserId
        - type
        - anonymous

    RespondConnectionBody:
      type: object
      properties:
        response:
          type: string
          enum: [accept, decline]
      required:
        - response

    Notification:
      type: object
      properties:
        id:
          type: string
        connectionId:
          type: string
        type:
          $ref: "#/components/schemas/ConnectionType"
        fromName:
          type: string
        anonymous:
          type: boolean
        read:
          type: boolean
        responded:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - connectionId
        - type
        - fromName
        - anonymous
        - read
        - responded
        - createdAt

    GymStats:
      type: object
      properties:
        activeNow:
          type: integer
        totalMembers:
          type: integer
        crushCount:
          type: integer
        buddyCount:
          type: integer
        advisorCount:
          type: integer
        spotterCount:
          type: integer
        gymName:
          type: string
      required:
        - activeNow
        - totalMembers
        - crushCount
        - buddyCount
        - advisorCount
        - spotterCount
        - gymName

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string

    WorkoutVideo:
      type: object
      required: [id, userId, objectPath, title, createdAt, likeCount, likedByMe]
      properties:
        id:
          type: string
        userId:
          type: string
        objectPath:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        likeCount:
          type: integer
        likedByMe:
          type: boolean

    CreateWorkoutVideoBody:
      type: object
      required: [objectPath, title]
      properties:
        objectPath:
          type: string
        title:
          type: string
        description:
          type: string

    UpdateWorkoutVideoBody:
      type: object
      required: [title]
      properties:
        title:
          type: string

    VideoLikeStatus:
      type: object
      required: [videoId, likeCount, likedByMe]
      properties:
        videoId:
          type: string
        likeCount:
          type: integer
        likedByMe:
          type: boolean
